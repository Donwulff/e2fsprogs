name: CodeQL

on:
  push:
    branches: [ defrag-mergesort ]
  pull_request:
    branches: [ defrag-mergesort ]
  schedule:
    - cron: '23 11 * * 3'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build C programs, including e4defrag
        if: matrix.build-mode == 'manual'
        run: |
          ./configure --enable-defrag
          make -j2
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
